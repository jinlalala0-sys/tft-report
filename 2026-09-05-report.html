<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S18自然之力 阵容胜率分析报告</title>
<style>
:root {
  --bg: #0d1117;
  --card-bg: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --gold: #ffd700;
  --purple: #c77dff;
  --blue: #4895ef;
  --green: #4caf50;
  --gray: #9e9e9e;
  --red: #f85149;
  --hover: #1f2937;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  line-height: 1.6;
}
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

.header {
  text-align: center;
  padding: 40px 20px 30px;
  background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
  border-bottom: 1px solid var(--border);
  margin-bottom: 30px;
}
.header h1 {
  font-size: 2.2rem;
  background: linear-gradient(90deg, var(--gold), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.header .subtitle { color: var(--text-dim); font-size: 1rem; }

.tier-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 0.85rem;
}
.tier-S { background: linear-gradient(135deg, #ffd700, #ffb300); color: #1a1a1a; }
.tier-A { background: linear-gradient(135deg, #c77dff, #9c27b0); color: #fff; }
.tier-B { background: linear-gradient(135deg, #4895ef, #3a86ff); color: #fff; }
.tier-C { background: linear-gradient(135deg, #4caf50, #388e3c); color: #fff; }
.tier-D { background: linear-gradient(135deg, #9e9e9e, #616161); color: #fff; }

.section { margin-bottom: 40px; }
.section-title {
  font-size: 1.5rem;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.search-box {
  margin-bottom: 20px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.search-box input {
  flex: 1;
  padding: 10px 15px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1rem;
}
.search-box input:focus { outline: none; border-color: var(--accent); }

.tier-section { margin-bottom: 35px; }
.tier-section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  font-size: 1.3rem;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 20px;
}
.comp-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.comp-card:hover {
  border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(88,166,255,0.15);
  transform: translateY(-2px);
}
.comp-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.comp-card .comp-name { font-size: 1.15rem; font-weight: 700; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.stat-item {
  text-align: center;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  padding: 6px 4px;
}
.stat-label { font-size: 0.7rem; color: var(--text-dim); }
.stat-value { font-size: 0.95rem; font-weight: 700; }
.stat-value.good { color: #4ade80; }
.stat-value.bad { color: #f87146; }
.stat-value.warn { color: #fbbf24; }

.code-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
}
.code-box input {
  flex: 1;
  background: none;
  border: none;
  color: var(--green);
  font-size: 0.85rem;
  font-family: monospace;
}
.code-box input:focus { outline: none; }
.copy-btn {
  padding: 4px 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
  white-space: nowrap;
  transition: background 0.2s;
}
.copy-btn:hover { background: #4493f8; }
.copy-btn.copied { background: var(--green); }

.hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.hero-tag {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 0.8rem;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
}
.hero-tag.carry { border-color: var(--gold); color: var(--gold); }
.hero-tag.subcarry { border-color: var(--accent); color: var(--accent); }
.hero-tag.core { border-color: var(--blue); color: var(--blue); }

.hex-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.hex-tag {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 0.78rem;
  background: rgba(199,125,255,0.1);
  border: 1px solid rgba(199,125,255,0.3);
  color: #d8a9ff;
}

.trait-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.trait-tag {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 0.78rem;
  background: rgba(72,149,239,0.1);
  border: 1px solid rgba(72,149,239,0.3);
  color: #6ab0ff;
}

.ranking-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card-bg);
  border-radius: 12px;
  overflow: hidden;
}
.ranking-table th {
  background: rgba(255,255,255,0.05);
  padding: 12px 10px;
  text-align: left;
  font-size: 0.85rem;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.ranking-table th:hover { color: var(--accent); }
.ranking-table th.sort-asc::after { content: " ▲"; }
.ranking-table th.sort-desc::after { content: " ▼"; }
.ranking-table td {
  padding: 10px;
  border-top: 1px solid var(--border);
  font-size: 0.88rem;
}
.ranking-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
.ranking-table tr.highlight td { background: rgba(255,215,0,0.08); }
.ranking-table tr:hover td { background: rgba(88,166,255,0.08); }
.rank-num { font-weight: 700; text-align: center; }
.rank-1 { color: var(--gold); }
.rank-2 { color: #c0c0c0; }
.rank-3 { color: #cd7f32; }

.filter-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  margin-bottom: 30px;
}
.filter-group {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}
.filter-group h3 { margin-bottom: 12px; font-size: 1.1rem; }
.filter-list {
  max-height: 300px;
  overflow-y: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.filter-item {
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 0.82rem;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-item:hover { border-color: var(--accent); }
.filter-item.checked {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.filter-results { margin-top: 16px; }
.filter-empty { color: var(--text-dim); text-align: center; padding: 20px; }

.rec-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.rec-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  transition: all 0.2s;
}
.rec-card:hover { border-color: var(--gold); box-shadow: 0 4px 16px rgba(255,215,0,0.1); }
.rec-card .rec-label {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.rec-card .rec-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
.rec-card .rec-stat { font-size: 0.85rem; color: var(--green); }

.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 0.9rem;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

.hidden { display: none !important; }

@media (max-width: 768px) {
  .cards-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .filter-section { grid-template-columns: 1fr; }
  .ranking-table { font-size: 0.75rem; }
  .ranking-table th, .ranking-table td { padding: 6px 4px; }
  .header h1 { font-size: 1.5rem; }
  .ranking-table .hide-mobile { display: none; }
}

.card-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
</style>
</head>

function copyCode(code, btn) {
  navigator.clipboard.writeText(code).then(() => {
    btn.classList.add('copied');
    btn.textContent = '已复制';
    showToast('阵容码已复制到剪贴板');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '复制';
    }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('copied');
    btn.textContent = '已复制';
    showToast('阵容码已复制到剪贴板');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '复制';
    }, 2000);
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function renderTierSections() {
  const tiers = ['S','A','B','C','D'];
  const container = document.getElementById('tier-sections');
  let html = '';
  for (const tier of tiers) {
    const comps = VALID_COMPS.filter(c => c.tier === tier && filterMatch(c));
    if (comps.length === 0) continue;
    html += '<div class="tier-section">';
    html += '<div class="tier-section-header"><span class="tier-badge tier-' + tier + '">' + tier + '</span> 级阵容 <span style="color:var(--text-dim);font-size:0.9rem;">(' + comps.length + '个)</span></div>';
    html += '<div class="cards-grid">';
    for (const c of comps) {
      html += renderCard(c);
    }
    html += '</div></div>';
  }
  if (html === '') {
    container.innerHTML = '<div class="filter-empty">未找到匹配的阵容</div>';
  } else {
    container.innerHTML = html;
  }
}

function renderCard(c) {
  const s = c.stats;
  const sortedHeroes = [...c.coreHeroes].sort((a, b) => b.price - a.price);
  let heroes = '<div class="hero-tags">';
  for (const h of sortedHeroes) {
    let cls = 'hero-tag';
    let label = h.heroName;
    if (h.isCarry) { cls += ' carry'; label = '★ ' + label; }
    else if (h.isSubCarry) { cls += ' subcarry'; label = '◇ ' + label; }
    else if (h.isCore) { cls += ' core'; }
    label += ' ' + h.price + '费';
    heroes += '<span class="' + cls + '">' + label + '</span>';
  }
  heroes += '</div>';

  const code = c.gameCode || '';
  const hasCode = c.gameCode && c.gameCode.length > 0;

  return '<div class="comp-card">' +
    '<div class="card-header"><span class="comp-name">' + c.name + '</span><span class="tier-badge tier-' + c.tier + '">' + c.tier + '</span></div>' +
    '<div class="stats-grid">' +
      '<div class="stat-item"><div class="stat-label">平均名次</div><div class="stat-value ' + (s.avgPlacement <= 4 ? 'good' : s.avgPlacement <= 4.5 ? 'warn' : 'bad') + '">' + s.avgPlacement + '</div></div>' +
      '<div class="stat-item"><div class="stat-label">前四率</div><div class="stat-value ' + (s.top4Rate >= 55 ? 'good' : s.top4Rate >= 45 ? 'warn' : 'bad') + '">' + s.top4Rate + '%</div></div>' +
      '<div class="stat-item"><div class="stat-label">吃鸡率</div><div class="stat-value ' + (s.topRate >= 15 ? 'good' : s.topRate >= 10 ? 'warn' : 'bad') + '">' + s.topRate + '%</div></div>' +
      '<div class="stat-item"><div class="stat-label">选取率</div><div class="stat-value">' + s.pickRate + '%</div></div>' +
      '<div class="stat-item"><div class="stat-label">样本量</div><div class="stat-value">' + s.sampleCount.toLocaleString() + '</div></div>' +
    '</div>' +
    (hasCode ?
      '<div><div class="card-label">阵容码（点击复制）</div><div class="code-box"><input type="text" value="' + code.replace(/"/g, '&quot;') + '" readonly><button class="copy-btn" onclick="copyCode(this.previousElementSibling.value, this)">复制</button></div></div>'
      : '<div class="card-label" style="color:var(--red)">暂无阵容码</div>'
    ) +
    '<div><div class="card-label">阵容组成</div>' + heroes + '</div>' +
  '</div>';
}

function filterMatch(c) {
  if (currentSearch && !c.name.toLowerCase().includes(currentSearch.toLowerCase())) return false;
  return true;
}

function filterCompositions() {
  currentSearch = document.getElementById('searchInput').value;
  renderTierSections();
}

function renderRanking() {
  let sorted = [...VALID_COMPS];
  sorted.sort((a, b) => {
    let va = a.stats[sortColumn], vb = b.stats[sortColumn];
    if (sortColumn === 'avgPlacement') {
      return sortDir === 'asc' ? va - vb : vb - va;
    }
    if (sortColumn === 'name' || sortColumn === 'tier') {
      return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return sortDir === 'asc' ? va - vb : vb - va;
  });

  let html = '';
  const sortedByTop4 = [...VALID_COMPS].sort((a, b) => b.stats.top4Rate - a.stats.top4Rate);
  const top3Ids = new Set(sortedByTop4.slice(0, 3).map(c => c.compId));

  for (let i = 0; i < sorted.length; i++) {
    const c = sorted[i];
    const s = c.stats;
    const isTop3 = top3Ids.has(c.compId);
    let rankClass = '';
    if (sortColumn === 'top4Rate' && sortDir === 'desc') {
      if (i === 0) rankClass = 'rank-1';
      else if (i === 1) rankClass = 'rank-2';
      else if (i === 2) rankClass = 'rank-3';
    }
    html += '<tr' + (isTop3 ? ' class="highlight"' : '') + '>' +
      '<td class="rank-num ' + rankClass + '">' + (i + 1) + '</td>' +
      '<td>' + c.name + '</td>' +
      '<td><span class="tier-badge tier-' + c.tier + '">' + c.tier + '</span></td>' +
      '<td>' + s.avgPlacement + '</td>' +
      '<td>' + s.top4Rate + '%</td>' +
      '<td>' + s.topRate + '%</td>' +
      '<td>' + s.pickRate + '%</td>' +
      '<td>' + s.sampleCount.toLocaleString() + '</td>' +
      '<td>' + (c.gameCode ? '<button class="copy-btn" onclick="copyCode(\'' + c.gameCode.replace(/'/g, "\\'") + '\', this)">复制</button>' : '无') + '</td>' +
    '</tr>';
  }
  document.getElementById('rankingBody').innerHTML = html;
}

document.querySelectorAll('#rankingTable th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (sortColumn === col) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortColumn = col;
      sortDir = col === 'avgPlacement' ? 'asc' : 'desc';
    }
    document.querySelectorAll('#rankingTable th').forEach(t => { t.classList.remove('sort-asc', 'sort-desc'); });
    th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
    renderRanking();
  });
});

function renderFilters() {
  let hexHtml = '';
  for (const h of ALL_HEXES) {
    hexHtml += '<span class="filter-item" data-hex="' + h + '" onclick="toggleHex(\'' + h.replace(/'/g, "\\'") + '\')">' + h + '</span>';
  }
  document.getElementById('hexFilterList').innerHTML = hexHtml;

  let traitHtml = '';
  for (const t of ALL_TRAITS) {
    traitHtml += '<span class="filter-item" data-trait="' + t + '" onclick="toggleTrait(\'' + t.replace(/'/g, "\\'") + '\')">' + t + '</span>';
  }
  document.getElementById('traitFilterList').innerHTML = traitHtml;
}

function toggleHex(name) {
  const el = document.querySelector('[data-hex="' + name + '"]');
  if (selectedHexes.has(name)) {
    selectedHexes.delete(name);
    el.classList.remove('checked');
  } else {
    selectedHexes.add(name);
    el.classList.add('checked');
  }
  renderFilterResults();
}

function toggleTrait(name) {
  const el = document.querySelector('[data-trait="' + name + '"]');
  if (selectedTraits.has(name)) {
    selectedTraits.delete(name);
    el.classList.remove('checked');
  } else {
    selectedTraits.add(name);
    el.classList.add('checked');
  }
  renderFilterResults();
}

function renderFilterResults() {
  const hasFilter = selectedHexes.size > 0 || selectedTraits.size > 0;
  if (!hasFilter) {
    document.getElementById('filterResults').innerHTML = '<div class="filter-empty">请在上方勾选符文或羁绊进行筛选</div>';
    return;
  }

  const filtered = VALID_COMPS.filter(c => {
    const hexMatch = selectedHexes.size === 0 || [...selectedHexes].every(h => c.recommendedHexes.some(ch => ch.name === h));
    const traitMatch = selectedTraits.size === 0 || [...selectedTraits].every(t => c.traits.includes(t));
    return hexMatch && traitMatch;
  });

  if (filtered.length === 0) {
    document.getElementById('filterResults').innerHTML = '<div class="filter-empty">未找到同时包含所选符文和羁绊的阵容</div>';
    return;
  }

  let html = '<div style="margin-bottom:12px;color:var(--text-dim);font-size:0.9rem;">共筛选出 <b style="color:var(--accent)">' + filtered.length + '</b> 个阵容</div>';
  html += '<div class="cards-grid">';
  for (const c of filtered) {
    html += renderCard(c);
  }
  html += '</div>';
  document.getElementById('filterResults').innerHTML = html;
}

function renderRecommendations() {
  const byTop4 = [...VALID_COMPS].sort((a, b) => b.stats.top4Rate - a.stats.top4Rate);
  const byTop1 = [...VALID_COMPS].sort((a, b) => b.stats.topRate - a.stats.topRate);
  const stable = VALID_COMPS.filter(c => c.stats.sampleCount > 1000).sort((a, b) => b.stats.top4Rate - a.stats.top4Rate);
  const lowTier = VALID_COMPS.filter(c => c.tier === 'C' || c.tier === 'D').sort((a, b) => b.stats.top4Rate - a.stats.top4Rate);
  const highTier = VALID_COMPS.filter(c => c.tier === 'S' || c.tier === 'A').sort((a, b) => b.stats.top4Rate - a.stats.top4Rate);

  const recs = [
    { label: '胜率最高阵容 (前四率)', comp: byTop4[0], stat: '前四率 ' + byTop4[0].stats.top4Rate + '%' },
    { label: '吃鸡率最高阵容', comp: byTop1[0], stat: '吃鸡率 ' + byTop1[0].stats.topRate + '%' },
    { label: '最稳定阵容 (样本>1000)', comp: stable[0], stat: '前四率 ' + stable[0].stats.top4Rate + '% | 样本 ' + stable[0].stats.sampleCount.toLocaleString() },
    { label: '低分段推荐 (C/D级)', comp: lowTier[0] || byTop4[0], stat: '前四率 ' + (lowTier[0] || byTop4[0]).stats.top4Rate + '%' },
    { label: '高分段推荐 (S/A级)', comp: highTier[0], stat: '前四率 ' + highTier[0].stats.top4Rate + '%' }
  ];

  let html = '';
  for (const r of recs) {
    const c = r.comp;
    html += '<div class="rec-card">' +
      '<div class="rec-label">' + r.label + '</div>' +
      '<div class="rec-name">' + c.name + '</div>' +
      '<div style="margin:4px 0;"><span class="tier-badge tier-' + c.tier + '">' + c.tier + '</span></div>' +
      '<div class="rec-stat">' + r.stat + '</div>' +
      (c.gameCode ? '<div style="margin-top:8px;"><button class="copy-btn" onclick="copyCode(\'' + c.gameCode.replace(/'/g, "\\'") + '\', this)">复制阵容码</button></div>' : '<div style="margin-top:8px;color:var(--red);font-size:0.8rem;">暂无阵容码</div>') +
    '</div>';
  }
  document.getElementById('recGrid').innerHTML = html;
}

renderTierSections();
renderRanking();
renderFilters();
renderRecommendations();
</script>
</body>
</html>

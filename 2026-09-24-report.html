<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>S18自然之力 阵容胜率分析报告 - 2026-09-24</title>
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --border-color: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent-blue: #58a6ff;
  --accent-gold: #ffd700;
  --accent-purple: #c77dff;
  --accent-green: #4caf50;
  --accent-red: #f85149;
  --accent-orange: #f0883e;
  --accent-silver: #c0c0c0;
  --accent-bronze: #cd7f32;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "WenQuanYi Micro Hei", Helvetica, Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  text-align: center;
  padding: 40px 20px 30px;
}

.header h1 {
  font-size: 2.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, #ffd700, #ffaa00, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
  letter-spacing: 2px;
}

.subtitle {
  color: var(--text-secondary);
  font-size: 0.95rem;
}

.section {
  margin-bottom: 40px;
}

.section-title {
  font-size: 1.4rem;
  font-weight: 600;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border-color);
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::before {
  content: "";
  width: 4px;
  height: 24px;
  background: linear-gradient(180deg, var(--accent-gold), var(--accent-orange));
  border-radius: 2px;
}

/* 梯队徽章 */
.tier-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 1rem;
  color: #fff;
  flex-shrink: 0;
}

.tier-S {
  background: linear-gradient(135deg, #ffd700, #ff8c00);
  box-shadow: 0 2px 12px rgba(255, 215, 0, 0.3);
}

.tier-A {
  background: linear-gradient(135deg, #c77dff, #9d4edd);
  box-shadow: 0 2px 12px rgba(199, 125, 255, 0.3);
}

.tier-B {
  background: linear-gradient(135deg, #58a6ff, #1f6feb);
  box-shadow: 0 2px 12px rgba(88, 166, 255, 0.3);
}

.tier-C {
  background: linear-gradient(135deg, #3fb950, #238636);
  box-shadow: 0 2px 12px rgba(63, 185, 80, 0.3);
}

.tier-D {
  background: linear-gradient(135deg, #6e7681, #484f58);
  box-shadow: 0 2px 12px rgba(110, 118, 129, 0.3);
}

/* 胜率排行表格 */
.ranking-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-secondary);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border-color);
}

.ranking-table th {
  background: var(--bg-tertiary);
  padding: 14px 12px;
  text-align: left;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: background 0.2s;
}

.ranking-table th:hover {
  background: #30363d;
}

.ranking-table th .sort-arrow {
  margin-left: 4px;
  font-size: 0.7rem;
}

.ranking-table td {
  padding: 12px;
  border-top: 1px solid var(--border-color);
  font-size: 0.9rem;
}

.ranking-table tbody tr:nth-child(even) {
  background: rgba(255, 255, 255, 0.02);
}

.ranking-table tbody tr:hover {
  background: rgba(88, 166, 255, 0.08);
}

.ranking-table .highlight {
  background: rgba(255, 215, 0, 0.08) !important;
}

.rank-num {
  font-weight: 700;
  font-size: 1.1rem;
  width: 40px;
  text-align: center;
}

.rank-1 { color: var(--accent-gold); }
.rank-2 { color: var(--accent-silver); }
.rank-3 { color: var(--accent-bronze); }

.comp-name-cell {
  font-weight: 600;
  min-width: 120px;
}

/* 统计数值颜色 */
.stat-value {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.stat-value.good {
  color: var(--accent-green);
}

.stat-value.warn {
  color: var(--accent-orange);
}

.stat-value.bad {
  color: var(--accent-red);
}

/* 搜索框 */
#searchInput {
  width: 100%;
  max-width: 400px;
  padding: 10px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 0.95rem;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}

#searchInput:focus {
  outline: none;
  border-color: var(--accent-blue);
}

#searchInput::placeholder {
  color: var(--text-muted);
}

/* 阵容码 */
.code-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-tertiary);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 0.8rem;
  max-width: 200px;
}

.code-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-secondary);
  font-family: monospace;
}

.copy-btn {
  padding: 4px 10px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}

.copy-btn:hover {
  background: #1f6feb;
}

.copy-btn.copied {
  background: var(--accent-green);
}

/* 阵容卡片网格 */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 16px;
}

.comp-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  transition: transform 0.2s, box-shadow 0.2s;
}

.comp-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  border-color: var(--accent-blue);
}

.comp-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.comp-card-title {
  flex: 1;
  font-size: 1.15rem;
  font-weight: 600;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.stat-item {
  text-align: center;
  padding: 8px 4px;
  background: var(--bg-tertiary);
  border-radius: 8px;
}

.stat-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.stat-value {
  font-size: 0.95rem;
  font-weight: 600;
}

/* 英雄标签 */
.heroes-section {
  margin-bottom: 12px;
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  margin: 2px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  font-size: 0.8rem;
}

.hero-tag.carry {
  border-color: var(--accent-gold);
  background: rgba(255, 215, 0, 0.1);
  color: var(--accent-gold);
}

.hero-tag.subcarry {
  border-color: var(--accent-blue);
  background: rgba(88, 166, 255, 0.1);
  color: var(--accent-blue);
}

.hero-tag.core {
  border-color: var(--accent-purple);
  background: rgba(199, 125, 255, 0.1);
  color: var(--accent-purple);
}

.hero-price {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-left: 2px;
}

/* 羁绊/海克斯标签 */
.traits-section, .hexes-section {
  margin-bottom: 12px;
}

.trait-tag, .hex-tag {
  display: inline-block;
  padding: 3px 8px;
  margin: 2px;
  border-radius: 4px;
  font-size: 0.75rem;
}

.trait-tag {
  background: rgba(88, 166, 255, 0.15);
  color: var(--accent-blue);
  border: 1px solid rgba(88, 166, 255, 0.3);
}

.hex-tag {
  background: rgba(199, 125, 255, 0.15);
  color: var(--accent-purple);
  border: 1px solid rgba(199, 125, 255, 0.3);
}

/* 段位分组 */
.tier-section {
  margin-bottom: 30px;
}

.tier-section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-color);
}

.tier-section-title {
  font-size: 1.2rem;
  font-weight: 600;
}

.tier-count {
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* 推荐卡片 */
.rec-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.rec-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  transition: transform 0.2s;
}

.rec-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent-gold);
}

.rec-card-title {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.rec-card-name {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.rec-card-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.rec-stat {
  text-align: center;
}

.rec-stat-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.rec-stat-value {
  font-size: 0.9rem;
  font-weight: 600;
}

/* 筛选器 */
.filter-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.filter-group {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
}

.filter-group h3 {
  font-size: 1rem;
  margin-bottom: 12px;
  color: var(--text-primary);
}

#hexFilterList, #traitFilterList {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filter-item {
  padding: 4px 12px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.filter-item:hover {
  border-color: var(--accent-blue);
}

.filter-item.checked {
  background: var(--accent-blue);
  border-color: var(--accent-blue);
  color: #fff;
}

.filter-item.checked.hex {
  background: var(--accent-purple);
  border-color: var(--accent-purple);
}

.filter-results {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 12px;
}

.filter-empty {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--accent-green);
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 0.9rem;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 1000;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* 响应式 */
@media (max-width: 768px) {
  .container {
    padding: 12px;
  }
  
  .header {
    padding: 24px 12px 20px;
  }
  
  .header h1 {
    font-size: 1.5rem;
  }
  
  .cards-grid {
    grid-template-columns: 1fr;
  }
  
  .filter-section {
    grid-template-columns: 1fr;
  }
  
  .stats-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  
  .ranking-table {
    font-size: 0.8rem;
  }
  
  .ranking-table th, .ranking-table td {
    padding: 8px 6px;
  }
  
  .code-box {
    max-width: 120px;
  }
}
</style>
</head>

function copyCode(code, btn) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = '已复制';
      btn.classList.add('copied');
      showToast('阵容码已复制到剪贴板');
      setTimeout(() => {
        btn.textContent = '复制';
        btn.classList.remove('copied');
      }, 2000);
    });
  } else {
    // 降级方案
    const textarea = document.createElement('textarea');
    textarea.value = code;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    btn.textContent = '已复制';
    btn.classList.add('copied');
    showToast('阵容码已复制到剪贴板');
    setTimeout(() => {
      btn.textContent = '复制';
      btn.classList.remove('copied');
    }, 2000);
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function getTierClass(tier) {
  return 'tier-' + (tier || 'D');
}

function formatNum(num, decimals = 1) {
  return Number(num).toFixed(decimals);
}

function getStatClass(value, type) {
  if (type === 'top4Rate') {
    if (value >= 55) return 'good';
    if (value >= 45) return 'warn';
    return 'bad';
  }
  if (type === 'topRate') {
    if (value >= 20) return 'good';
    if (value >= 10) return 'warn';
    return 'bad';
  }
  if (type === 'avgPlacement') {
    if (value <= 4) return 'good';
    if (value <= 4.5) return 'warn';
    return 'bad';
  }
  return '';
}

function renderCard(c) {
  const heroes = (c.coreHeroes || []).sort((a, b) => b.price - a.price);
  const heroTags = heroes.map(h => {
    let cls = 'hero-tag';
    let prefix = '';
    if (h.isCarry) { cls += ' carry'; prefix = '★'; }
    else if (h.isSubCarry) { cls += ' subcarry'; prefix = '◇'; }
    else if (h.isCore) { cls += ' core'; prefix = '●'; }
    return `<span class="${cls}">${prefix}${h.heroName}<span class="hero-price">${h.price}费</span></span>`;
  }).join('');

  const traitTags = (c.traits || []).slice(0, 6).map(t => 
    `<span class="trait-tag">${t}</span>`
  ).join('');

  return `
    <div class="comp-card">
      <div class="comp-card-header">
        <span class="tier-badge ${getTierClass(c.tier)}">${c.tier}</span>
        <span class="comp-card-title">${c.name}</span>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">平均名次</div>
          <div class="stat-value ${getStatClass(c.stats.avgPlacement, 'avgPlacement')}">${formatNum(c.stats.avgPlacement)}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">前四率</div>
          <div class="stat-value ${getStatClass(c.stats.top4Rate, 'top4Rate')}">${formatNum(c.stats.top4Rate)}%</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">吃鸡率</div>
          <div class="stat-value ${getStatClass(c.stats.topRate, 'topRate')}">${formatNum(c.stats.topRate)}%</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">选取率</div>
          <div class="stat-value">${formatNum(c.stats.pickRate)}%</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">样本量</div>
          <div class="stat-value">${c.stats.sampleCount.toLocaleString()}</div>
        </div>
      </div>
      <div class="code-box">
        <span class="code-text" title="${c.gameCode}">${c.gameCode.substring(0, 20)}...</span>
        <button class="copy-btn" onclick="copyCode('${c.gameCode.replace(/'/g, "\'")}', this)">复制</button>
      </div>
      <div class="heroes-section">
        ${heroTags}
      </div>
      <div class="traits-section">
        ${traitTags}
      </div>
    </div>
  `;
}

function renderTierSections() {
  const container = document.getElementById('tier-sections');
  const tiers = ['S', 'A', 'B', 'C', 'D'];
  
  const filteredComps = VALID_COMPS.filter(c => filterMatch(c));
  
  let html = '';
  for (const tier of tiers) {
    const tierComps = filteredComps.filter(c => c.tier === tier);
    if (tierComps.length === 0) continue;
    
    // 按前四率降序排列
    tierComps.sort((a, b) => b.stats.top4Rate - a.stats.top4Rate);
    
    const cardsHtml = tierComps.map(c => renderCard(c)).join('');
    
    html += `
      <div class="tier-section">
        <div class="tier-section-header">
          <span class="tier-badge ${getTierClass(tier)}">${tier}</span>
          <span class="tier-section-title">${tier}级阵容</span>
          <span class="tier-count">${tierComps.length} 个阵容</span>
        </div>
        <div class="cards-grid">
          ${cardsHtml}
        </div>
      </div>
    `;
  }
  
  container.innerHTML = html;
}

function filterMatch(c) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  
  // 匹配名称
  if (c.name.toLowerCase().includes(q)) return true;
  
  // 匹配英雄
  if ((c.coreHeroes || []).some(h => h.heroName.toLowerCase().includes(q))) return true;
  
  // 匹配羁绊
  if ((c.traits || []).some(t => t.toLowerCase().includes(q))) return true;
  
  return false;
}

function filterCompositions() {
  searchQuery = document.getElementById('searchInput').value;

  renderRanking();
}

function sortTable(field) {
  if (currentSort.field === field) {
    currentSort.asc = !currentSort.asc;
  } else {
    currentSort.field = field;
    currentSort.asc = false; // 默认降序
  }
  
  // 更新排序箭头
  const headers = document.querySelectorAll('.ranking-table th');
  headers.forEach(th => {
    const arrow = th.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = '↕';
  });
  
  const fieldMap = {
    'rank': 0, 'name': 1, 'tier': 2, 'avgPlacement': 3,
    'top4Rate': 4, 'topRate': 5, 'pickRate': 6, 'sampleCount': 7
  };
  const idx = fieldMap[field];
  if (idx !== undefined && headers[idx]) {
    const arrow = headers[idx].querySelector('.sort-arrow');
    if (arrow) arrow.textContent = currentSort.asc ? '↑' : '↓';
  }
  
  renderRanking();
}

function renderRanking() {
  const tbody = document.getElementById('rankingBody');
  
  let comps = [...VALID_COMPS].filter(c => filterMatch(c));
  
  // 排序
  const tierOrder = { S: 0, A: 1, B: 2, C: 3, D: 4 };
  
  comps.sort((a, b) => {
    let valA, valB;
    
    switch (currentSort.field) {
      case 'name':
        valA = a.name;
        valB = b.name;
        return currentSort.asc ? valA.localeCompare(valB, 'zh') : valB.localeCompare(valA, 'zh');
      case 'tier':
        valA = tierOrder[a.tier] || 5;
        valB = tierOrder[b.tier] || 5;
        return currentSort.asc ? valA - valB : valB - valA;
      case 'avgPlacement':
        valA = a.stats.avgPlacement;
        valB = b.stats.avgPlacement;
        // 平均名次数值越小越好，默认升序（第一名在前）
        return currentSort.asc ? valA - valB : valB - valA;
      case 'top4Rate':
        valA = a.stats.top4Rate;
        valB = b.stats.top4Rate;
        return currentSort.asc ? valA - valB : valB - valA;
      case 'topRate':
        valA = a.stats.topRate;
        valB = b.stats.topRate;
        return currentSort.asc ? valA - valB : valB - valA;
      case 'pickRate':
        valA = a.stats.pickRate;
        valB = b.stats.pickRate;
        return currentSort.asc ? valA - valB : valB - valA;
      case 'sampleCount':
        valA = a.stats.sampleCount;
        valB = b.stats.sampleCount;
        return currentSort.asc ? valA - valB : valB - valA;
      case 'rank':
      default:
        valA = a.stats.top4Rate;
        valB = b.stats.top4Rate;
        return currentSort.asc ? valA - valB : valB - valA;
    }
  });
  
  let html = '';
  comps.forEach((c, i) => {
    const rank = i + 1;
    let rankClass = '';
    let highlightClass = '';
    if (rank === 1) { rankClass = 'rank-1'; highlightClass = 'highlight'; }
    else if (rank === 2) { rankClass = 'rank-2'; highlightClass = 'highlight'; }
    else if (rank === 3) { rankClass = 'rank-3'; highlightClass = 'highlight'; }
    
    html += `
      <tr class="${highlightClass}">
        <td class="rank-num ${rankClass}">${rank}</td>
        <td class="comp-name-cell">${c.name}</td>
        <td><span class="tier-badge ${getTierClass(c.tier)}" style="width:28px;height:28px;font-size:0.8rem;">${c.tier}</span></td>
        <td class="stat-value ${getStatClass(c.stats.avgPlacement, 'avgPlacement')}">${formatNum(c.stats.avgPlacement)}</td>
        <td class="stat-value ${getStatClass(c.stats.top4Rate, 'top4Rate')}">${formatNum(c.stats.top4Rate)}%</td>
        <td class="stat-value ${getStatClass(c.stats.topRate, 'topRate')}">${formatNum(c.stats.topRate)}%</td>
        <td class="stat-value">${formatNum(c.stats.pickRate)}%</td>
        <td class="stat-value">${c.stats.sampleCount.toLocaleString()}</td>
        <td>
          <div class="code-box" style="max-width:150px;">
            <button class="copy-btn" onclick="copyCode('${c.gameCode.replace(/'/g, "\'")}', this)">复制</button>
          </div>
        </td>
      </tr>
    `;
  });
  
  tbody.innerHTML = html;
}

function renderFilters() {
  const hexContainer = document.getElementById('hexFilterList');
  const traitContainer = document.getElementById('traitFilterList');
  
  if (ALL_HEXES.length === 0) {
    hexContainer.innerHTML = '<span style="color: var(--text-muted); font-size: 0.85rem;">暂无数据</span>';
  } else {
    hexContainer.innerHTML = ALL_HEXES.map(h => 
      `<span class="filter-item hex" onclick="toggleHex('${h.replace(/'/g, "\'")}')">${h}</span>`
    ).join('');
  }
  
  traitContainer.innerHTML = ALL_TRAITS.map(t => 
    `<span class="filter-item" onclick="toggleTrait('${t.replace(/'/g, "\'")}')">${t}</span>`
  ).join('');
}

function toggleHex(name) {
  if (selectedHexes.has(name)) {
    selectedHexes.delete(name);
  } else {
    selectedHexes.add(name);
  }
  updateFilterUI();
  renderFilterResults();
}

function toggleTrait(name) {
  if (selectedTraits.has(name)) {
    selectedTraits.delete(name);
  } else {
    selectedTraits.add(name);
  }
  updateFilterUI();
  renderFilterResults();
}

function updateFilterUI() {
  document.querySelectorAll('#hexFilterList .filter-item').forEach(el => {
    const name = el.textContent;
    if (selectedHexes.has(name)) {
      el.classList.add('checked');
    } else {
      el.classList.remove('checked');
    }
  });
  
  document.querySelectorAll('#traitFilterList .filter-item').forEach(el => {
    const name = el.textContent;
    if (selectedTraits.has(name)) {
      el.classList.add('checked');
    } else {
      el.classList.remove('checked');
    }
  });
}

function renderFilterResults() {
  const container = document.getElementById('filterResults');
  
  if (selectedHexes.size === 0 && selectedTraits.size === 0) {
    container.innerHTML = '<div class="filter-empty">请选择上方的强化符文或羁绊进行筛选</div>';
    return;
  }
  
  let filtered = VALID_COMPS.filter(c => {
    // 海克斯筛选（AND逻辑）
    if (selectedHexes.size > 0) {
      const compHexes = (c.recommendedHexes || []).map(h => h.name);
      for (const hex of selectedHexes) {
        if (!compHexes.includes(hex)) return false;
      }
    }
    
    // 羁绊筛选（AND逻辑）
    if (selectedTraits.size > 0) {
      const compTraits = c.traits || [];
      for (const trait of selectedTraits) {
        if (!compTraits.includes(trait)) return false;
      }
    }
    
    return true;
  });
  
  filtered.sort((a, b) => b.stats.top4Rate - a.stats.top4Rate);
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="filter-empty">没有找到匹配的阵容</div>';
    return;
  }
  
  container.innerHTML = filtered.map(c => renderCard(c)).join('');
}

function renderRecommendations() {
  const container = document.getElementById('recGrid');
  
  // 前四率最高
  const byTop4 = [...VALID_COMPS].sort((a, b) => b.stats.top4Rate - a.stats.top4Rate)[0];
  
  // 吃鸡率最高
  const byTopRate = [...VALID_COMPS].sort((a, b) => b.stats.topRate - a.stats.topRate)[0];
  
  // 最稳定（样本>1000的前四率最高）
  const stable = [...VALID_COMPS].filter(c => c.stats.sampleCount > 1000)
    .sort((a, b) => b.stats.top4Rate - a.stats.top4Rate)[0];
  
  // 低分段推荐（C/D级，样本多的）
  const lowTier = [...VALID_COMPS].filter(c => c.tier === 'C' || c.tier === 'D')
    .sort((a, b) => b.stats.sampleCount - a.stats.sampleCount)[0];
  
  // 高分段推荐（S/A级，前四率最高）
  const highTier = [...VALID_COMPS].filter(c => c.tier === 'S' || c.tier === 'A')
    .sort((a, b) => b.stats.top4Rate - a.stats.top4Rate)[0];
  
  const recs = [
    { title: '前四率最高', comp: byTop4, color: '#ffd700' },
    { title: '吃鸡率最高', comp: byTopRate, color: '#f85149' },
    { title: '最稳定阵容', comp: stable, color: '#4caf50' },
    { title: '低分段推荐', comp: lowTier, color: '#c77dff' },
    { title: '高分段首选', comp: highTier, color: '#58a6ff' },
  ];
  
  let html = '';
  for (const rec of recs) {
    if (!rec.comp) continue;
    const c = rec.comp;
    html += `
      <div class="rec-card">
        <div class="rec-card-title" style="color: ${rec.color};">${rec.title}</div>
        <div class="rec-card-name">
          <span class="tier-badge ${getTierClass(c.tier)}" style="width:32px;height:32px;font-size:0.9rem;">${c.tier}</span>
          ${c.name}
        </div>
        <div class="rec-card-stats">
          <div class="rec-stat">
            <div class="rec-stat-label">前四率</div>
            <div class="rec-stat-value ${getStatClass(c.stats.top4Rate, 'top4Rate')}">${formatNum(c.stats.top4Rate)}%</div>
          </div>
          <div class="rec-stat">
            <div class="rec-stat-label">吃鸡率</div>
            <div class="rec-stat-value ${getStatClass(c.stats.topRate, 'topRate')}">${formatNum(c.stats.topRate)}%</div>
          </div>
          <div class="rec-stat">
            <div class="rec-stat-label">样本量</div>
            <div class="rec-stat-value">${c.stats.sampleCount.toLocaleString()}</div>
          </div>
        </div>
        <div class="code-box">
          <button class="copy-btn" onclick="copyCode('${c.gameCode.replace(/'/g, "\'")}', this)" style="width:100%;">复制阵容码</button>
        </div>
      </div>
    `;
  }
  
  container.innerHTML = html;
}

// 初始化
renderTierSections();
renderRanking();
renderFilters();
renderRecommendations();
</script>
</body>
</html>

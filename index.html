<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFT 阵容数据报告 - 2026-10-10</title>
<style>
:root{--bg:#0f0f17;--card:#1a1a2e;--border:#2a2a4a;--text:#e0e0e8;--muted:#8888a0;--accent:#6c5ce7;--gold:#ffd700;--green:#00b894;--red:#e74c3c;--blue:#3498db;--orange:#e67e22}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:16px}
.header{text-align:center;padding:32px 16px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:12px;margin-bottom:24px;border:1px solid var(--border)}
.header h1{font-size:28px;color:var(--gold);margin-bottom:8px}
.header .meta{color:var(--muted);font-size:14px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.header .meta span{background:var(--card);padding:4px 12px;border-radius:20px;border:1px solid var(--border)}
.section{margin-bottom:32px}
.section-title{font-size:20px;color:var(--accent);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:8px}
.section-title .icon{font-size:24px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#16213e;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:0.5px;position:sticky;top:0}
tr:hover{background:rgba(108,92,231,0.1)}
.tier-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:bold;font-size:13px;min-width:24px;text-align:center}
.tier-S{background:#e74c3c;color:#fff}
.tier-A{background:#e67e22;color:#fff}
.tier-B{background:#f1c40f;color:#333}
.tier-C{background:#3498db;color:#fff}
.tier-D{background:#95a5a6;color:#fff}
.comp-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.comp-card .comp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.comp-card .comp-name{font-size:18px;font-weight:bold}
.comp-card .comp-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.comp-card .comp-stats .stat{background:var(--bg);padding:2px 8px;border-radius:4px}
.code-box{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px 12px;margin-top:8px;font-family:"Courier New",monospace;font-size:12px;word-break:break-all;color:var(--green);position:relative}
.copy-btn{position:absolute;top:4px;right:4px;background:var(--accent);color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px}
.copy-btn:hover{opacity:0.8}
.hero-tags,.trait-tags,.hex-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.hero-tag{background:#2a2a4a;padding:2px 8px;border-radius:12px;font-size:11px}
.hero-carry{border:1px solid var(--gold)}
.hero-sub{border:1px solid var(--blue)}
.trait-tag{background:rgba(108,92,231,0.2);padding:2px 8px;border-radius:12px;font-size:11px;color:var(--accent)}
.hex-tag{background:rgba(0,184,148,0.15);padding:2px 8px;border-radius:12px;font-size:11px;color:var(--green)}
.filter-bar{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.filter-bar input,.filter-bar select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:4px;font-size:14px}
.filter-bar input{flex:1;min-width:200px}
.filter-bar .filter-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tier-group{margin-bottom:24px}
.tier-group-title{font-size:16px;font-weight:bold;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.winrate-bar{display:inline-block;height:8px;background:var(--green);border-radius:4px;vertical-align:middle;margin-left:4px}
.search-highlight{background:rgba(255,215,0,0.2)}
@media(max-width:768px){th,td{padding:6px 8px;font-size:12px}.header h1{font-size:20px}}
</style>
</head>

const tierColors = {"S":"#e74c3c","A":"#e67e22","B":"#f1c40f","C":"#3498db","D":"#95a5a6"};

function tierBadge(t){return '<span class="tier-badge tier-'+t+'">'+t+'</span>';}

function copyCode(btn,code){
navigator.clipboard.writeText(code).then(()=>{
btn.textContent='已复制';
setTimeout(()=>btn.textContent='复制',2000);
});
}

function heroTags(comp){
let html='<div class="hero-tags">';
comp.coreHeroes.forEach(h=>{
let cls='hero-tag';
if(h.isCarry)cls+=' hero-carry';
if(h.isSubCarry)cls+=' hero-sub';
html+='<span class="'+cls+'">'+h.heroName+(h.isCarry?'[主C]':h.isSubCarry?'[副C]':'')+'</span>';
});
html+='</div>';
return html;
}

function traitTags(comp){
return '<div class="trait-tags">'+comp.traits.map(t=>'<span class="trait-tag">'+t+'</span>').join('')+'</div>';
}

function hexTags(comp){
if(!comp.recommendedHexes||comp.recommendedHexes.length===0)return'';
return '<div class="hex-tags">'+comp.recommendedHexes.slice(0,5).map(h=>'<span class="hex-tag">'+h.name+' '+h.pickRate+'%</span>').join('')+'</div>';
}

function codeBox(comp){
return '<div class="code-box">'+comp.gameCode+'<button class="copy-btn" onclick="copyCode(this,\'\'+this.previousSibling.textContent.replace(/复制/g,\'\')+'\'\')">复制</button></div>';
}

function renderRanking(){
const sorted=[...DATA].sort((a,b)=>b.stats.top4Rate-a.stats.top4Rate);
let html='';
sorted.forEach((c,i)=>{
html+='<tr>'+
'<td>'+(i+1)+'</td>'+
'<td><strong>'+c.name+'</strong></td>'+
'<td>'+tierBadge(c.tier)+'</td>'+
'<td><span style="color:var(--green)">'+c.stats.top4Rate+'%</span></td>'+
'<td>'+c.stats.topRate+'%</td>'+
'<td>'+c.stats.avgPlacement+'</td>'+
'<td>'+c.stats.pickRate+'%</td>'+
'<td>'+c.stats.sampleCount.toLocaleString()+'</td>'+
'<td><button class="copy-btn" style="position:static" onclick="copyCode(this,\' '+c.gameCode+' \')">复制码</button></td>'+
'</tr>';
});
document.getElementById('rankBody').innerHTML=html;
}

function renderRecommend(){
const sTier=DATA.filter(c=>c.tier==='S').sort((a,b)=>b.stats.top4Rate-a.stats.top4Rate);
let html='';
sTier.forEach(c=>{
html+='<div class="comp-card">'+
'<div class="comp-header"><span class="comp-name">'+tierBadge(c.tier)+' '+c.name+'</span>'+
'<div class="comp-stats">'+
'<span class="stat">前四 '+c.stats.top4Rate+'%</span>'+
'<span class="stat">登顶 '+c.stats.topRate+'%</span>'+
'<span class="stat">均排名 '+c.stats.avgPlacement+'</span>'+
'<span class="stat">样本 '+c.stats.sampleCount.toLocaleString()+'</span>'+
'</div></div>'+
heroTags(c)+traitTags(c)+hexTags(c)+
'<div class="code-box" id="code_'+c.compId+'">'+c.gameCode+'<button class="copy-btn" onclick="copyCode(this,document.getElementById(\'code_'+c.compId+'\').firstChild.textContent)">复制</button></div>'+
'</div>';
});
document.getElementById('recommendBody').innerHTML=html;
}

function getFiltered(){
const q=document.getElementById('searchInput').value.toLowerCase();
const tf=document.getElementById('tierFilter').value;
const hf=document.getElementById('hexFilter').value;
return DATA.filter(c=>{
if(tf&&c.tier!==tf)return false;
if(hf&&(!c.recommendedHexes||!c.recommendedHexes.some(h=>h.name===hf)))return false;
if(q){
const text=(c.name+' '+c.traits.join(' ')+' '+c.coreHeroes.map(h=>h.heroName).join(' ')+' '+(c.recommendedHexes?c.recommendedHexes.map(h=>h.name).join(' '):'')).toLowerCase();
if(!text.includes(q))return false;
}
return true;
});
}

function applyFilter(){renderFilter();}

function renderTierGroup(){
let html='';
tiers.forEach(t=>{
const comps=DATA.filter(c=>c.tier===t).sort((a,b)=>b.stats.top4Rate-a.stats.top4Rate);
if(comps.length===0)return;
html+='<div class="tier-group">'+
'<div class="tier-group-title">'+tierBadge(t)+' '+t+'级 ('+comps.length+')</div>';
comps.forEach(c=>{
html+='<div class="comp-card" style="margin-bottom:8px">'+
'<div class="comp-header"><span class="comp-name">'+c.name+'</span>'+
'<div class="comp-stats">'+
'<span class="stat">前四 '+c.stats.top4Rate+'%</span>'+
'<span class="stat">登顶 '+c.stats.topRate+'%</span>'+
'<span class="stat">均排名 '+c.stats.avgPlacement+'</span>'+
'<span class="stat">样本 '+c.stats.sampleCount.toLocaleString()+'</span>'+
'</div></div>'+
heroTags(c)+traitTags(c)+
'<div class="code-box" id="tcode_'+c.compId+'">'+c.gameCode+'<button class="copy-btn" onclick="copyCode(this,document.getElementById(\'tcode_'+c.compId+'\').firstChild.textContent)">复制</button></div>'+
'</div>';
});
html+='</div>';
});
document.getElementById('tierGroupBody').innerHTML=html;
}

function initHexFilter(){
const hexSet=new Set();
DATA.forEach(c=>{
if(c.recommendedHexes)c.recommendedHexes.forEach(h=>hexSet.add(h.name));
});
const sel=document.getElementById('hexFilter');
[...hexSet].sort().forEach(h=>{
const opt=document.createElement('option');
opt.value=h;opt.textContent=h;
sel.appendChild(opt);
});
}

renderRanking();
renderRecommend();
renderFilter();
renderTierGroup();
initHexFilter();
</script>

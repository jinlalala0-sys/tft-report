<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S18自然之力 阵容胜率分析报告</title>
<style>
:root {
  --bg: #0d1117;
  --card-bg: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --gold: #ffd700;
  --purple: #c77dff;
  --blue: #4895ef;
  --green: #4caf50;
  --gray: #9e9e9e;
  --red: #f85149;
  --hover: #1f2937;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  line-height: 1.6;
}
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.header {
  text-align: center;
  padding: 40px 20px 30px;
  background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
  border-bottom: 1px solid var(--border);
  margin-bottom: 30px;
}
.header h1 {
  font-size: 2.2rem;
  background: linear-gradient(90deg, var(--gold), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.header .subtitle { color: var(--text-dim); font-size: 1rem; }
.tier-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 0.85rem;
}
.tier-S { background: linear-gradient(135deg, #ffd700, #ffb300); color: #1a1a1a; }
.tier-A { background: linear-gradient(135deg, #c77dff, #9c27b0); color: #fff; }
.tier-B { background: linear-gradient(135deg, #4895ef, #3a86ff); color: #fff; }
.tier-C { background: linear-gradient(135deg, #4caf50, #388e3c); color: #fff; }
.tier-D { background: linear-gradient(135deg, #9e9e9e, #616161); color: #fff; }
.section { margin-bottom: 40px; }
.section-title {
  font-size: 1.5rem;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.search-box {
  margin-bottom: 20px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.search-box input {
  flex: 1;
  padding: 10px 15px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1rem;
}
.search-box input:focus { outline: none; border-color: var(--accent); }
.ranking-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card-bg);
  border-radius: 12px;
  overflow: hidden;
}
.ranking-table th {
  background: rgba(255,255,255,0.05);
  padding: 12px 10px;
  text-align: left;
  font-size: 0.85rem;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.ranking-table th:hover { color: var(--accent); }
.ranking-table th.sort-asc::after { content: " \25B2"; }
.ranking-table th.sort-desc::after { content: " \25BC"; }
.ranking-table td {
  padding: 10px;
  border-top: 1px solid var(--border);
  font-size: 0.88rem;
}
.ranking-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
.ranking-table tr.highlight td { background: rgba(255,215,0,0.08); }
.ranking-table tr:hover td { background: rgba(88,166,255,0.08); }
.rank-num { font-weight: 700; text-align: center; }
.rank-1 { color: var(--gold); }
.rank-2 { color: #c0c0c0; }
.rank-3 { color: #cd7f32; }
.rec-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.rec-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  transition: all 0.2s;
}
.rec-card:hover { border-color: var(--gold); box-shadow: 0 4px 16px rgba(255,215,0,0.1); }
.rec-card .rec-label { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; }
.rec-card .rec-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
.rec-card .rec-stat { font-size: 0.85rem; color: var(--green); }
.filter-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  margin-bottom: 30px;
}
.filter-group {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}
.filter-group h3 { margin-bottom: 12px; font-size: 1.1rem; }
.filter-list {
  max-height: 300px;
  overflow-y: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.filter-item {
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 0.82rem;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-item:hover { border-color: var(--accent); }
.filter-item.checked {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.filter-results { margin-top: 16px; }
.filter-empty { color: var(--text-dim); text-align: center; padding: 20px; }
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 20px;
}
.comp-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.comp-card:hover {
  border-color: var(--accent);
  box-shadow: 0 8px 24px rgba(88,166,255,0.15);
  transform: translateY(-2px);
}
.comp-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.comp-card .comp-name { font-size: 1.15rem; font-weight: 700; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.stat-item {
  text-align: center;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  padding: 6px 4px;
}
.stat-label { font-size: 0.7rem; color: var(--text-dim); }
.stat-value { font-size: 0.95rem; font-weight: 700; }
.stat-value.good { color: #4ade80; }
.stat-value.bad { color: #f87146; }
.stat-value.warn { color: #fbbf24; }
.code-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
}
.code-box input {
  flex: 1;
  background: none;
  border: none;
  color: var(--green);
  font-size: 0.85rem;
  font-family: monospace;
}
.code-box input:focus { outline: none; }
.copy-btn {
  padding: 4px 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
  white-space: nowrap;
  transition: background 0.2s;
}
.copy-btn:hover { background: #4493f8; }
.copy-btn.copied { background: var(--green); }
.hero-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.hero-tag {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 0.8rem;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
}
.hero-tag.carry { border-color: var(--gold); color: var(--gold); }
.hero-tag.subcarry { border-color: var(--accent); color: var(--accent); }
.hero-tag.core { border-color: var(--blue); color: var(--blue); }
.hex-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.hex-tag {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 0.78rem;
  background: rgba(199,125,255,0.1);
  border: 1px solid rgba(199,125,255,0.3);
  color: #d8a9ff;
}
.trait-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.trait-tag {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 0.78rem;
  background: rgba(72,149,239,0.1);
  border: 1px solid rgba(72,149,239,0.3);
  color: #6ab0ff;
}
.tier-section { margin-bottom: 35px; }
.tier-section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  font-size: 1.3rem;
}
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 0.9rem;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.hidden { display: none !important; }
@media (max-width: 768px) {
  .cards-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .filter-section { grid-template-columns: 1fr; }
  .ranking-table { font-size: 0.75rem; }
  .ranking-table th, .ranking-table td { padding: 6px 4px; }
  .header h1 { font-size: 1.5rem; }
  .ranking-table .hide-mobile { display: none; }
}
.card-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
</style>
</head>

</div>

var RECS = [{"label": "前四率最高", "name": "重装女警", "tier": "S", "stat": "前四率 62.4%"}, {"label": "登顶率最高", "name": "巨龙95", "tier": "S", "stat": "登顶率 24.2%"}, {"label": "平均排名最优", "name": "巨龙95", "tier": "S", "stat": "平均排名 3.86"}, {"label": "高分段推荐", "name": "重装女警", "tier": "S", "stat": "前四率 62.4%"}, {"label": "低分段推荐", "name": "重装月男", "tier": "C", "stat": "前四率 46.6%"}];

function getStatClass(key, val) {
  if (key === "avgPlacement") return val <= 4.2 ? "good" : val <= 4.6 ? "warn" : "bad";
  if (key === "top4Rate") return val >= 55 ? "good" : val >= 48 ? "warn" : "bad";
  if (key === "topRate") return val >= 12 ? "good" : val >= 8 ? "warn" : "bad";
  return "";
}

function formatStat(key, val) {
  if (key === "avgPlacement") return val.toFixed(2);
  if (key === "top4Rate" || key === "topRate") return val.toFixed(1) + "%";
  if (key === "pickRate") return (val * 100).toFixed(1) + "%";
  return val.toLocaleString();
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(function() {
    var toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(function() { toast.classList.remove("show"); }, 1500);
  });
}

var currentSort = {field: "top4Rate", asc: false};
var selectedHexes = new Set();
var selectedTraits = new Set();

function renderRanking() {
  var search = document.getElementById("searchInput").value.toLowerCase();
  var filtered = COMPOSITIONS.filter(function(c) { return c.name.toLowerCase().indexOf(search) !== -1; });
  
  filtered.sort(function(a, b) {
    var av, bv;
    switch (currentSort.field) {
      case "rank": av = b.stats.top4Rate; bv = a.stats.top4Rate; break;
      case "name": av = a.name; bv = b.name; break;
      case "tier": av = TIER_ORDER[a.tier] || 99; bv = TIER_ORDER[b.tier] || 99; break;
      case "avgPlacement": av = a.stats.avgPlacement; bv = b.stats.avgPlacement; break;
      case "top4Rate": av = a.stats.top4Rate; bv = b.stats.top4Rate; break;
      case "topRate": av = a.stats.topRate; bv = b.stats.topRate; break;
      case "pickRate": av = a.stats.pickRate; bv = b.stats.pickRate; break;
      case "sampleCount": av = a.stats.sampleCount; bv = b.stats.sampleCount; break;
      default: av = a.stats.top4Rate; bv = b.stats.top4Rate;
    }
    if (typeof av === "string") return currentSort.asc ? av.localeCompare(bv) : bv.localeCompare(av);
    return currentSort.asc ? av - bv : bv - av;
  });
  
  var tbody = document.getElementById("rankingBody");
  tbody.innerHTML = filtered.map(function(c, i) {
    var rankClass = i < 3 ? " rank-" + (i + 1) : "";
    var highlightClass = i < 3 ? " highlight" : "";
    return '<tr class="' + highlightClass + '">' +
      '<td class="rank-num ' + rankClass + '">' + (i + 1) + '</td>' +
      '<td><strong>' + c.name + '</strong></td>' +
      '<td><span class="tier-badge tier-' + c.tier + '">' + c.tier + '</span></td>' +
      '<td class="stat-value ' + getStatClass("avgPlacement", c.stats.avgPlacement) + '">' + formatStat("avgPlacement", c.stats.avgPlacement) + '</td>' +
      '<td class="stat-value ' + getStatClass("top4Rate", c.stats.top4Rate) + '">' + formatStat("top4Rate", c.stats.top4Rate) + '</td>' +
      '<td class="stat-value ' + getStatClass("topRate", c.stats.topRate) + '">' + formatStat("topRate", c.stats.topRate) + '</td>' +
      '<td>' + formatStat("pickRate", c.stats.pickRate) + '</td>' +
      '<td>' + c.stats.sampleCount.toLocaleString() + '</td>' +
      '<td>' + (c.gameCode ? '<button class="copy-btn" onclick="copyCode(\'' + c.gameCode.replace(/'/g, "\\'") + '\')">复制</button>' : '-') + '</td>' +
    '</tr>';
  }).join("");
}

function renderRecs() {
  var grid = document.getElementById("recGrid");
  grid.innerHTML = RECS.map(function(r) {
    return '<div class="rec-card">' +
      '<div class="rec-label">' + r.label + '</div>' +
      '<div class="rec-name">' + r.name + '</div>' +
      '<div class="rec-stat">' + r.stat + '</div>' +
      '<div style="margin-top:4px;"><span class="tier-badge tier-' + r.tier + '">' + r.tier + '</span></div>' +
    '</div>';
  }).join("");
}

function renderCompCard(c) {
  var heroes = c.coreHeroes.map(function(h) {
    var cls = "hero-tag core";
    if (h.isCarry) cls = "hero-tag carry";
    else if (h.isSubCarry) cls = "hero-tag subcarry";
    return '<span class="' + cls + '">' + h.heroName + '</span>';
  }).join("");
  var hexes = (c.recommendedHexes || []).slice(0, 5).map(function(h) {
    return '<span class="hex-tag">' + h.name + '</span>';
  }).join("");
  var traits = (c.traits || []).map(function(t) {
    return '<span class="trait-tag">' + t + '</span>';
  }).join("");
  return '<div class="comp-card">' +
    '<div class="card-header">' +
      '<span class="comp-name">' + c.name + '</span>' +
      '<span class="tier-badge tier-' + c.tier + '">' + c.tier + '</span>' +
    '</div>' +
    '<div class="stats-grid">' +
      '<div class="stat-item"><div class="stat-label">平均排名</div><div class="stat-value ' + getStatClass("avgPlacement", c.stats.avgPlacement) + '">' + formatStat("avgPlacement", c.stats.avgPlacement) + '</div></div>' +
      '<div class="stat-item"><div class="stat-label">前四率</div><div class="stat-value ' + getStatClass("top4Rate", c.stats.top4Rate) + '">' + formatStat("top4Rate", c.stats.top4Rate) + '</div></div>' +
      '<div class="stat-item"><div class="stat-label">登顶率</div><div class="stat-value ' + getStatClass("topRate", c.stats.topRate) + '">' + formatStat("topRate", c.stats.topRate) + '</div></div>' +
      '<div class="stat-item"><div class="stat-label">选取率</div><div class="stat-value">' + formatStat("pickRate", c.stats.pickRate) + '</div></div>' +
      '<div class="stat-item"><div class="stat-label">样本</div><div class="stat-value">' + c.stats.sampleCount.toLocaleString() + '</div></div>' +
    '</div>' +
    (c.gameCode ? '<div class="code-box"><input value="' + c.gameCode.replace(/"/g, '&quot;') + '" readonly><button class="copy-btn" onclick="copyCode(\'' + c.gameCode.replace(/'/g, "\\'") + '\')">复制</button></div>' : '') +
    '<div class="card-label">核心英雄</div><div class="hero-tags">' + heroes + '</div>' +
    '<div class="card-label">羁绊</div><div class="trait-tags">' + traits + '</div>' +
    (hexes ? '<div class="card-label">推荐符文</div><div class="hex-tags">' + hexes + '</div>' : '') +
  '</div>';
}

function renderHexFilters() {
  var hexes = {};
  var traits = {};
  COMPOSITIONS.forEach(function(c) {
    (c.recommendedHexes || []).forEach(function(h) { hexes[h.name] = Math.max(hexes[h.name] || 0, h.pickRate || 0); });
    (c.traits || []).forEach(function(t) { traits[t] = true; });
  });
  var sortedHexes = Object.entries(hexes).sort(function(a, b) { return b[1] - a[1]; });
  var sortedTraits = Object.keys(traits).sort();
  
  document.getElementById("hexFilterList").innerHTML = sortedHexes.map(function(e) {
    return '<span class="filter-item" data-type="hex" data-name="' + e[0] + '" onclick="toggleFilter(this)">' + e[0] + '</span>';
  }).join("");
  document.getElementById("traitFilterList").innerHTML = sortedTraits.map(function(name) {
    return '<span class="filter-item" data-type="trait" data-name="' + name + '" onclick="toggleFilter(this)">' + name + '</span>';
  }).join("");
}

function toggleFilter(el) {
  var type = el.dataset.type;
  var name = el.dataset.name;
  var set = type === "hex" ? selectedHexes : selectedTraits;
  if (set.has(name)) { set.delete(name); el.classList.remove("checked"); }
  else { set.add(name); el.classList.add("checked"); }
  applyFilter();
}

function applyFilter() {
  var container = document.getElementById("filterResults");
  if (selectedHexes.size === 0 && selectedTraits.size === 0) {
    container.innerHTML = '<div class="filter-empty">请在上方勾选符文或羁绊进行筛选</div>';
    return;
  }
  var filtered = COMPOSITIONS.filter(function(c) {
    var hasHex = selectedHexes.size === 0 || (c.recommendedHexes || []).some(function(h) { return selectedHexes.has(h.name); });
    var hasTrait = selectedTraits.size === 0 || (c.traits || []).some(function(t) { return selectedTraits.has(t); });
    return hasHex && hasTrait;
  });
  if (filtered.length === 0) {
    container.innerHTML = '<div class="filter-empty">没有匹配的阵容</div>';
    return;
  }
  filtered.sort(function(a, b) { return b.stats.top4Rate - a.stats.top4Rate; });
  container.innerHTML = '<div class="cards-grid">' + filtered.map(function(c) { return renderCompCard(c); }).join("") + '</div>';
}

function renderTierSections() {
  var tiers = ["S", "A", "B", "C", "D"];
  var container = document.getElementById("tier-sections");
  container.innerHTML = tiers.map(function(tier) {
    var comps = COMPOSITIONS.filter(function(c) { return c.tier === tier; }).sort(function(a, b) { return b.stats.top4Rate - a.stats.top4Rate; });
    if (comps.length === 0) return "";
    return '<div class="tier-section">' +
      '<div class="tier-section-header">' +
        '<span class="tier-badge tier-' + tier + '">' + tier + '</span>' +
        '<span>' + TIER_NAMES[tier] + ' (' + comps.length + '个阵容)</span>' +
      '</div>' +
      '<div class="cards-grid">' + comps.map(function(c) { return renderCompCard(c); }).join("") + '</div>' +
    '</div>';
  }).join("");
}

document.querySelectorAll(".ranking-table th[data-sort]").forEach(function(th) {
  th.addEventListener("click", function() {
    var field = th.dataset.sort;
    if (currentSort.field === field) { currentSort.asc = !currentSort.asc; }
    else { currentSort.field = field; currentSort.asc = field === "avgPlacement"; }
    document.querySelectorAll(".ranking-table th").forEach(function(t) { t.classList.remove("sort-asc", "sort-desc"); });
    th.classList.add(currentSort.asc ? "sort-asc" : "sort-desc");
    renderRanking();
  });
});

function filterCompositions() { renderRanking(); }

renderRanking();
renderRecs();
renderHexFilters();
renderTierSections();
</script>
</body>
</html>
